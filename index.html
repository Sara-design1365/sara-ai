<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sarv-blue-1: #0a1a3d;
    --sarv-blue-2: #143a6b;
    --sarv-blue-3: #2f6fb0;
    --sarv-blue-glow: #185fa5;
    --text-light: #0a1a3d;
    --text-muted: #5b6b82;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: var(--text-light);
    overflow: hidden;
  }

  .page {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border: 1px solid rgba(10,26,61,0.12);
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(10,26,61,0.08);
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---------- Header / cypress mark ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    flex-shrink: 0;
    width: 100%;
    max-width: 460px;
    margin-bottom: 24px;
  }

  .cypress-mark {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .cypress-mark path {
    fill: none;
    stroke: var(--sarv-blue-glow);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .headline {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .headline .dot {
    color: #000000;
  }

  .subline {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ---------- Chat area ---------- */
  .chat-window {
    max-height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
  }

  .chat-window:empty { display: none; }

  .chat-window::-webkit-scrollbar { width: 6px; }
  .chat-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    padding-top: 56px;
  }

  .chips {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .chip {
    border: 1px solid rgba(10,26,61,0.18);
    background: transparent;
    color: var(--text-light);
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .chip:hover {
    background: rgba(10,26,61,0.05);
    border-color: rgba(10,26,61,0.32);
  }

  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: rgba(10,26,61,0.08);
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid rgba(10,26,61,0.12);
    box-shadow: 0 1px 3px rgba(10,26,61,0.06);
    border-bottom-left-radius: 4px;
  }

  .msg.typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px 18px;
  }

  .dot-flash {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sarv-blue-glow);
    animation: flash 1.2s infinite ease-in-out;
  }
  .dot-flash:nth-child(2) { animation-delay: 0.2s; }
  .dot-flash:nth-child(3) { animation-delay: 0.4s; }

  @keyframes flash {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  /* ---------- Input bar ---------- */
  .input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    border: 1px solid rgba(10,26,61,0.16);
    border-radius: 26px;
    padding: 6px 6px 6px 20px;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(10,26,61,0.06);
  }

  .input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-light);
    font-size: 15px;
    padding: 10px 0;
  }

  .input-bar input::placeholder {
    color: var(--text-muted);
  }

  .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #F35B15;
    color: #ffffff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s, opacity 0.12s;
  }

  .send-btn:hover { transform: scale(1.06); }
  .send-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 10px;
    flex-shrink: 0;
  @media (max-width: 600px) {
  .page {
    padding: 20px 16px;
    height: auto;
    min-height: 100vh;
  }

  html, body {
    overflow-y: auto;
  }

  .header {
    margin-bottom: 32px;
  }

  .headline {
    font-size: 20px;
  }

  .card {
    padding: 24px 20px;
    max-width: 100%;
  }

  .chat-window {
    max-height: 260px;
  }
}}
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <div>
      <div class="headline">Hi, I'm Sara<span class="dot">.ai</span></div>
    </div>
  </div>

  <div class="card">

    <div class="chat-window" id="chatWindow">
      <div class="empty-state" id="emptyState">
        <div class="chips">
          <div class="chip" data-prompt="Tell me about yourself.">Tell me about yourself</div>
          <div class="chip" data-prompt="How is your design process?">How is your design process</div>
          <div class="chip" data-prompt="What is your superpower?">What is your superpower</div>
        </div>
      </div>
    </div>

    <div>
      <div class="input-bar">
        <input type="text" id="chatInput" placeholder="Ask Sara.ai anything..." />
        <button class="send-btn" id="sendBtn" aria-label="Send">&#8593;</button>
      </div>
      <div class="footer-note">Sara.ai can make mistakes. This is an experimental portfolio assistant.</div>
    </div>

  </div>
</div>

<script>
  const chatWindow = document.getElementById('chatWindow');
  const emptyState = document.getElementById('emptyState');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  // ---- EDIT THIS: replace with your real background / case study content ----
  const SYSTEM_PROMPT = `You are Sara.ai, an interactive assistant embedded in Sara's UX portfolio.
Sara is a senior experience designer at U.S. Bank with 8+ years in enterprise UX, transitioning toward AI-era design roles.

Speak in first person AS Sara. Be direct, warm, and concrete — not corporate or generic.

[PLACEHOLDER - replace with Sara's real case study summaries, e.g.:]
- Project 1: [name, problem, your role, outcome, metrics]
- Project 2: [name, problem, your role, outcome, metrics]
- Project 3: [name, problem, your role, outcome, metrics]

[PLACEHOLDER - replace with Sara's design philosophy / process in 2-3 sentences]

[PLACEHOLDER - replace with what Sara is looking for next, e.g. AI-era product design roles, design systems + AI tooling, etc.]

If asked something you don't have information on, say so honestly and redirect to contact info instead of making things up.`;

  let history = [];

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function addMessage(role, text) {
    if (emptyState) { emptyState.remove(); }
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatWindow.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg assistant typing';
    div.innerHTML = '<span class="dot-flash"></span><span class="dot-flash"></span><span class="dot-flash"></span>';
    chatWindow.appendChild(div);
    scrollToBottom();
    return div;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    chatInput.value = '';
    sendBtn.disabled = true;

    const typingEl = addTypingIndicator();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });

      const data = await response.json();
      typingEl.remove();

      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const replyText = textBlocks.join('\\n') || "Sorry, something went wrong on my end.";

      addMessage('assistant', replyText);
      history.push({ role: 'assistant', content: replyText });
    } catch (err) {
      typingEl.remove();
      addMessage('assistant', "I couldn't connect just now. Try again in a moment.");
      console.error('Sara.ai API error:', err);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(chatInput.value);
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => sendMessage(chip.dataset.prompt));
  });
</script>

</body>
</html>
